name: Go CI

on:
  push:
    branches: [main, dev]
    paths: ["src/go/**", ".github/workflows/ci-go.yml"]
  pull_request:
    branches: [main]
    paths: ["src/go/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: src/go
      - name: Vet
        working-directory: src/go
        run: go vet ./...
      - name: Build
        working-directory: src/go
        run: go build ./...
      - name: Test
        working-directory: src/go
        run: go test -v -race -count=1 ./...
      - name: Sec
        uses: securego/gosec@master
        with:
          working-directory: src/go
