name: Robot Framework OWASP Tests

on:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches: [main]
    paths: ["tests/security/**"]
  pull_request:
    branches: [main]
    paths: ["tests/security/**"]
  workflow_dispatch:

jobs:
  robot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Robot Framework
        run: |
          pip install robotframework robotframework-requests robotframework-sshlibrary robotframework-seleniumlibrary
      - name: Start CA services
        run: |
          docker compose -f docker-compose.test.yml up -d ca-engine ca-api
          sleep 10
      - name: Run OWASP Top 10 Tests
        run: |
          robot --outputdir robot-reports \
            --variable CA_API:http://localhost:8080 \
            tests/security/robot/tests/
      - name: OWASP ZAP DAST
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: "http://localhost:8080"
          artifact_name: "zap-reports"
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            robot-reports/
            zap-reports/
      - name: Stop services
        run: docker compose -f docker-compose.test.yml down
