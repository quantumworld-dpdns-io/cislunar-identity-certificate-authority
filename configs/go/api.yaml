server:
  addr: ":8080"
  read_timeout: 30s
  write_timeout: 30s
  max_request_size: 10MB

ca:
  grpc_addr: "localhost:50051"
  grpc_timeout: 10s

auth:
  jwt_secret: "${JWT_SECRET}"
  token_expiry: 24h
  api_key_header: "X-API-Key"

rate_limiting:
  enabled: true
  requests_per_second: 100
  burst: 200

logging:
  level: "info"
  format: "json"
