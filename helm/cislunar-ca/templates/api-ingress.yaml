apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cislunar-ca.name" . }}-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  {{- if .Values.ca-api.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ca-api.ingress.host }}
      secretName: cislunar-ca-tls
  {{- end }}
  rules:
    - host: {{ .Values.ca-api.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cislunar-ca.name" . }}-api
                port:
                  number: {{ .Values.ca-api.service.port }}
